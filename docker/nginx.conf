server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /updates/windows/ {
    proxy_pass http://minio.rjagi.cn:9000/ai-ruizhi/updates/windows/;
    proxy_http_version 1.1;
    proxy_set_header Host minio.rjagi.cn:9000;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_redirect off;

    add_header Cache-Control "no-store" always;
  }

  location /updates/macos/ {
    proxy_pass http://minio.rjagi.cn:9000/ai-ruizhi/updates/macos/;
    proxy_http_version 1.1;
    proxy_set_header Host minio.rjagi.cn:9000;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_redirect off;

    add_header Cache-Control "no-store" always;
  }

  location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|webp)$ {
    expires 1h;
    add_header Cache-Control "public, max-age=3600";
    try_files $uri =404;
  }
}
